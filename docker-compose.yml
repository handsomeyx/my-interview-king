# 面试大王 - 阶段1 本地执行（B 方案）
#
# 去 Judge0/Nacos/Redis/Gateway，仅 code-exec 单容器。
# code-exec 容器内 javac + java 跑用户 Java 代码（Process.exec，JDK 镜像含 javac）。
#
# 启动：docker compose up -d --build
# 测试：curl http://localhost:8081/api/run -H "Content-Type: application/json" \
#      -d '{"language":"java","code":"public class Main{public static void main(String[] a){System.out.println(\"hi\");}}"}'

services:
  code-exec-service:
    build:
      context: ./backend
      dockerfile: code-exec-service/Dockerfile
    container_name: ikm-code-exec
    ports:
      - "8081:8081"
    restart: on-failure
